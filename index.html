
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YASHU PUDO - Realistic 3D Watch</title>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030810;color:#fff;
 font-family:Arial,sans-serif
}
header{
 text-align:center;padding:18px;
 background:#071522;border-bottom:1px solid #00dfff
}
h1{margin:0;color:#00eaff;letter-spacing:4px}
header p{font-size:12px;color:#9db6c9}
main{max-width:1200px;margin:auto;padding:14px}
.buttons{
 display:flex;justify-content:center;gap:9px;
 flex-wrap:wrap;margin:15px 0
}
button{
 padding:11px 15px;border-radius:8px;
 border:1px solid #00dfff;background:#101e2d;
 color:white;font-weight:bold;cursor:pointer
}
button.active,button:hover{
 background:#064353;color:#00efff
}
#stage{
 height:600px;max-width:100%;
 border:1px solid #12516a;border-radius:15px;
 overflow:hidden;
 background:radial-gradient(ellipse,#102d45,#020711 75%)
}
#stage canvas{display:block;width:100%;height:100%}
.controls{
 display:flex;justify-content:center;gap:12px;
 flex-wrap:wrap;margin:15px 0;color:#a8c7d8
}
input{accent-color:#00eaff;width:150px}
.info{
 padding:15px;background:#091522;
 border:1px solid #00dfff;border-radius:10px;
 margin:15px 0
}
.info h3{color:#00eaff;margin:0 0 8px}
.info p{color:#cbd5e1;line-height:1.6;margin:0}
#parts{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:8px
}
.part{
 background:#0c1725;border:1px solid #26394a;
 border-radius:7px;padding:11px;text-align:left;
 color:white;cursor:pointer
}
.part.selected{border-color:#ff8800;background:#292116}
.part b{color:#ffb000;margin-right:8px}
.part small{display:block;color:#91a9bd;margin-top:5px}
h2{color:#ff9700;font-size:16px;margin-top:25px}
footer{text-align:center;padding:25px;color:#7893a8}
@media(max-width:600px){
 #stage{height:480px}
 h1{font-size:23px}
}
</style>
</head>

<body>
<header>
<h1>YASHU PUDO</h1>
<p>LJ939 4G SMARTWATCH | REALISTIC 3D TEARDOWN</p>
</header>

<main>

<div class="buttons">
<button id="explode" class="active">💥 EXPLODE ALL</button>
<button id="assemble">📦 ASSEMBLE</button>
<button id="spin">🔄 360° AUTO SPIN</button>
<button id="reset">↻ RESET</button>
</div>

<div id="stage"></div>

<div class="controls">
<span>ROTATION</span>
<input type="range" id="rotation" min="0" max="360" value="0">
<span id="rotText">0°</span>
<span>EXPLODE</span>
<input type="range" id="explosion" min="0" max="100" value="100">
<span id="expText">100%</span>
</div>

<div class="info">
<h3 id="title">PART #1 : CPU / PROCESSOR</h3>
<p id="description">Smartwatch का मुख्य दिमाग।</p>
</div>

<h2>45 HARDWARE COMPONENTS</h2>
<div id="parts"></div>

</main>

<footer>YASHU PUDO © 2026 | 3D SMARTWATCH ENGINEERING</footer>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* 45 PARTS DATABASE */

const data=[
['CPU / Processor','घड़ी का मुख्य प्रोसेसर।'],
['RAM IC','ऐप चलाने की मेमोरी।'],
['ROM / Flash IC','डेटा स्टोरेज चिप।'],
['4G LTE Modem','4G नेटवर्क चिप।'],
['RF Antenna Circuit','नेटवर्क सिग्नल सर्किट।'],
['SIM Connector','SIM कनेक्शन।'],
['PMIC Power IC','पावर मैनेजमेंट।'],
['Audio IC','ऑडियो एम्पलीफायर।'],
['Charging IC','चार्जिंग कंट्रोल।'],
['Display Connector','डिस्प्ले कनेक्टर।'],
['Touch Controller','टच कंट्रोलर।'],
['Camera Connector','कैमरा कनेक्टर।'],
['Sensor IC','सेंसर प्रोसेसर।'],
['Battery Connector','बैटरी कनेक्शन।'],
['Microphone Circuit','माइक सर्किट।'],
['Speaker','आवाज देने वाला स्पीकर।'],
['SIM Card Slot','SIM ट्रे।'],
['Speaker Mesh','स्पीकर जाली।'],
['Speaker Connection','स्पीकर वायरिंग।'],
['Power Button','पावर बटन।'],
['Microphone','माइक पोर्ट।'],
['Camera','HD कैमरा।'],
['Button Flex Cable','बटन केबल।'],
['Camera Flex Cable','कैमरा केबल।'],
['Display Screen','AMOLED स्क्रीन।'],
['Display Glass','प्रोटेक्टिव ग्लास।'],
['Touch Panel','टच लेयर।'],
['Display Flex Cable','डिस्प्ले केबल।'],
['Heart Rate Sensor','हार्ट रेट सेंसर।'],
['Blood Oxygen Sensor','SpO2 सेंसर।'],
['Sensor LED','सेंसर लाइट।'],
['Sensor Receiver','सेंसर रिसीवर।'],
['Charging Contacts','चार्जिंग पिन।'],
['Rechargeable Battery','बैटरी पैक।'],
['Vibration Motor','वाइब्रेशन मोटर।'],
['4G Antenna','4G एंटीना।'],
['Wi-Fi / BT Antenna','Wi-Fi और Bluetooth एंटीना।'],
['GPS Antenna','GPS एंटीना।'],
['Internal PCB','मदरबोर्ड।'],
['Crystal Oscillator','क्लॉक कंपोनेंट।'],
['Capacitors','कैपेसिटर।'],
['Resistors','रेसिस्टर।'],
['Inductors','इंडक्टर।'],
['Connectors','FPC कनेक्टर।'],
['Power Switch Circuit','पावर कंट्रोल।']
];

/* SCENE */

const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030810);

const camera=new THREE.PerspectiveCamera(
 40,stage.clientWidth/stage.clientHeight,0.1,100
);
camera.position.set(9,10,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
stage.appendChild(renderer.domElement);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;
orbit.minDistance=8;
orbit.maxDistance=25;

scene.add(new THREE.HemisphereLight(0x9bdfff,0x17202d,2));

const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,8);
scene.add(light);

const blue=new THREE.PointLight(0x00cfff,90);
blue.position.set(-6,4,5);
scene.add(blue);

const orange=new THREE.PointLight(0xff6400,65);
orange.position.set(5,0,-6);
scene.add(orange);

const grid=new THREE.GridHelper(30,30,0x12445d,0x10283b);
grid.position.y=-4;
scene.add(grid);

/* MAIN WATCH */

const watch=new THREE.Group();
scene.add(watch);

const parts=[];

/* MATERIALS */

const steel=new THREE.MeshStandardMaterial({
 color:0x526273,metalness:0.92,roughness:0.2
});
const black=new THREE.MeshStandardMaterial({
 color:0x101722,metalness:0.7,roughness:0.22
});
const glass=new THREE.MeshPhysicalMaterial({
 color:0x061522,metalness:0.35,roughness:0.08,
 clearcoat:1,clearcoatRoughness:0.04
});
const rubber=new THREE.MeshStandardMaterial({
 color:0x10151d,roughness:0.8
});
const gold=new THREE.MeshStandardMaterial({
 color:0xe6a52d,metalness:0.9,roughness:0.2
});
const green=new THREE.MeshStandardMaterial({
 color:0x087a4b,metalness:0.5,roughness:0.35
});

/* ROUNDED RECTANGLE */

function roundedPlate(w,h,depth,r,material){
 const s=new THREE.Shape();
 s.moveTo(-w/2+r,-h/2);
 s.lineTo(w/2-r,-h/2);
 s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
 s.lineTo(w/2,h/2-r);
 s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
 s.lineTo(-w/2+r,h/2);
 s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
 s.lineTo(-w/2,-h/2+r);
 s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);

 const g=new THREE.ExtrudeGeometry(s,{
  depth:depth,bevelEnabled:true,
  bevelSegments:3,steps:1,
  bevelSize:0.045,bevelThickness:0.045
 });
 g.rotateX(-Math.PI/2);
 return new THREE.Mesh(g,material);
}

/* BASE CASE */

const caseBody=roundedPlate(4.5,5.5,0.65,0.7,steel);
caseBody.position.y=-0.35;
watch.add(caseBody);

/* BLACK BEZEL */

const bezel=roundedPlate(4.22,5.22,0.15,0.62,black);
bezel.position.y=0.32;
watch.add(bezel);

/* STRAPS */

function makeStrap(z,rotation=0){
 const strap=roundedPlate(2.55,3.25,0.42,0.85,rubber);
 strap.position.set(0,-0.3,z);
 strap.rotation.y=rotation;
 watch.add(strap);

 // Strap holes
 for(let i=0;i<5;i++){
  const hole=new THREE.Mesh(
   new THREE.CylinderGeometry(0.09,0.09,0.08,20),black
  );
  hole.rotation.x=Math.PI/2;
  hole.position.set(0,-0.03,z+(z>0?0.9+i*0.35:-0.9-i*0.35));
  watch.add(hole);
 }
}
makeStrap(-4.2);
makeStrap(4.2);

/* SCREEN */

const screen=roundedPlate(3.72,4.65,0.08,0.48,glass);
screen.position.y=0.53;
watch.add(screen);

/* SCREEN INNER LIGHT */

const screenFace=roundedPlate(3.48,4.4,0.025,0.4,
 new THREE.MeshStandardMaterial({
  color:0x07182d,metalness:0.2,roughness:0.12,
  emissive:0x071c3b,emissiveIntensity:0.6
 })
);
screenFace.position.y=0.64;
watch.add(screenFace);

/* WATCH DISPLAY MARKINGS */

function addText(text,x,z,size,color){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle=color;
 ctx.font='bold 75px Arial';
 ctx.textAlign='center';
 ctx.fillText(text,256,90);

 const texture=new THREE.CanvasTexture(canvas);
 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(size,size*0.25),
  new THREE.MeshBasicMaterial({map:texture,transparent:true})
 );
 mesh.rotation.x=-Math.PI/2;
 mesh.position.set(x,0.69,z);
 watch.add(mesh);
}
addText('10:48',0,-0.45,2.4,'#ffffff');
addText('4G  VOLTE',0,0.45,1.7,'#00eaff');

/* SIDE CROWN */

function cylinderAt(position,radius,length,material,axis='x'){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(radius,radius,length,32),
  material
 );
 if(axis==='x')m.rotation.z=Math.PI/2;
 if(axis==='z')m.rotation.x=Math.PI/2;
 m.position.set(...position);
 watch.add(m);
 return m;
}

cylinderAt([2.32,0,-0.3],0.34,0.45,gold);
cylinderAt([2.55,0,-0.3],0.23,0.12,black);

const buttonSide=cylinderAt([2.3,-0.15,0.7],0.17,0.4,steel);

/* BACK COVER AND SENSOR */

const back=roundedPlate(3.8,4.8,0.15,0.6,black);
back.position.y=-0.85;
watch.add(back);

const sensorRing=new THREE.Mesh(
 new THREE.CylinderGeometry(0.85,0.85,0.12,48),
 gold
);
sensorRing.position.set(0,-0.98,0);
watch.add(sensorRing);

const sensorGlass=new THREE.Mesh(
 new THREE.CylinderGeometry(0.68,0.68,0.14,48),
 new THREE.MeshPhysicalMaterial({
  color:0x06141c,metalness:0.3,roughness:0.1
 })
);
sensorGlass.position.set(0,-1.08,0);
watch.add(sensorGlass);

for(let i=0;i<4;i++){
 const led=new THREE.Mesh(
  new THREE.CircleGeometry(0.12,24),
  new THREE.MeshBasicMaterial({color:0x00ff66})
 );
 led.rotation.x=-Math.PI/2;
 const a=i*Math.PI/2;
 led.position.set(Math.cos(a)*0.42,-1.17,Math.sin(a)*0.42);
 watch.add(led);
}

/* COMPONENT HELPER */

function addComponent(index,geometry,material,position,explodeY){
 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.set(...position);
 mesh.userData.index=index;
 mesh.userData.base=mesh.position.clone();
 mesh.userData.explodeY=explodeY;
 watch.add(mesh);
 parts[index]=mesh;
 return mesh;
}

function box(w,h,d,material){
 return new THREE.BoxGeometry(w,h,d);
}

function chip(index,x,z,w=0.36,d=0.36){
 const m=addComponent(
  index,box(w,0.14,d),
  index===0?gold:black,
  [x,0.78,z],1.8+(index%4)*0.35
 );
 return m;
}

/* 1–15 MOTHERBOARD CHIPS */

const pcb=roundedPlate(3.6,4.4,0.13,0.4,green);
pcb.position.y=0.84;
watch.add(pcb);

for(let i=0;i<15;i++){
 const x=-1.25+(i%4)*0.8;
 const z=-1.45+Math.floor(i/4)*0.85;
 chip(i,x,z,i===0?0.65:0.35,i===0?0.65:0.35);
}

/* 16 SPEAKER */

addComponent(15,new THREE.CylinderGeometry(0.48,0.48,0.16,40),
 steel,[-1.15,0.2,-1.6],-1.8);

/* 17 SIM SLOT */

addComponent(16,box(0.85,0.13,0.4),gold,
 [-1.1,0.2,-2.15],-1.4);

/* 18 MESH */

addComponent(17,new THREE.CylinderGeometry(0.2,0.2,0.05,24),
 black,[-1.15,0.28,-1.6],-1.2);

/* 19 CONNECTION */

addComponent(18,box(0.45,0.12,0.12),gold,
 [-0.6,0.8,-1.5],1.5);

/* 20 POWER BUTTON */

addComponent(19,new THREE.CylinderGeometry(0.2,0.2,0.3,32),
 gold,[2.45,0,-0.3],2);

/* 21 MICROPHONE */

addComponent(20,new THREE.CylinderGeometry(0.12,0.12,0.1,20),
 black,[1.9,0,1.9],1.2);

/* 22 CAMERA LENS */

addComponent(21,new THREE.CylinderGeometry(0.43,0.43,0.22,40),
 steel,[0.8,0.85,-2.05],2.5);

const lens=new THREE.Mesh(
 new THREE.CylinderGeometry(0.28,0.28,0.24,32),
 new THREE.MeshPhysicalMaterial({
  color:0x032f55,metalness:0.8,roughness:0.05
 })
);
lens.position.set(0.8,1.04,-2.05);
watch.add(lens);

/* 23-24 FLEX CABLES */

addComponent(22,box(0.7,0.05,0.3),gold,
 [1.2,0.9,-1.5],1.4);

addComponent(23,box(0.6,0.05,0.25),gold,
 [0.6,0.9,-1.7],1.7);

/* 25-28 DISPLAY LAYERS */

addComponent(24,roundedPlate(3.72,4.65,0.05,0.48,
 new THREE.MeshStandardMaterial({
  color:0x102a50,metalness:0.2,roughness:0.1,
  emissive:0x06152c
 })),[0,0,0],[]);

/* Replace display layer position */
parts[24].position.set(0,0.72,0);
parts[24].userData.base=parts[24].position.clone();
parts[24].userData.explodeY=3.8;

addComponent(25,roundedPlate(3.85,4.8,0.04,0.5,glass),
 [0,0.81,0],[]);
parts[25].userData.explodeY=4.8;

addComponent(26,roundedPlate(3.65,4.55,0.04,0.45,
 new THREE.MeshStandardMaterial({color:0x175e83,transparent:true,opacity:0.55})),
 [0,0.77,0],[]);
parts[26].userData.explodeY=4.3;

addComponent(27,box(0.55,0.08,0.18),gold,
 [1.2,0.8,2.0],2.7);

/* 29-33 BACK SENSORS */

for(let i=28;i<=31;i++){
 const a=(i-28)*Math.PI/2;
 addComponent(i,new THREE.CylinderGeometry(0.17,0.17,0.13,28),
 i===30?new THREE.MeshBasicMaterial({color:0x00ff55}):gold,
 [Math.cos(a)*0.42,-1.22,Math.sin(a)*0.42],-2.4-i*0.02);
}

for(let i=0;i<4;i++){
 addComponent(32,new THREE.CylinderGeometry(0.08,0.08,0.12,20),
 gold,[-0.6+i*0.4,-1.12,2.25],-1.8);
 if(i<3) parts[32].userData.base=parts[32].position.clone();
}

/* 34 BATTERY */

addComponent(33,roundedPlate(3.0,3.8,0.48,0.35,
 new THREE.MeshStandardMaterial({
  color:0x263445,metalness:0.7,roughness:0.3
 })),
 [0,-0.15,0],-3.6);

/* 35 VIBRATION MOTOR */

addComponent(34,new THREE.CylinderGeometry(0.27,0.27,0.22,32),
 steel,[1.15,-0.65,1.45],-2.7);

/* 36-38 ANTENNAS */

for(let i=35;i<=37;i++){
 addComponent(i,box(2.1,0.04,0.13),
 gold,[-0.8,0.9,-1.7+(i-35)*0.35],1.7+(i-35)*0.4);
}

/* 39 PCB */

addComponent(38,roundedPlate(3.5,4.3,0.1,0.3,green),
 [0,0.95,0],2.8);

/* 40-45 ELECTRONIC COMPONENTS */

for(let i=39;i<=44;i++){
 const x=-1.2+((i-39)%3)*1.15;
 const z=0.3+Math.floor((i-39)/3)*0.8;

 addComponent(i,box(0.24,0.13,0.25),
 i%2?gold:black,[x,1.02,z],1.8+(i%3)*0.5);
}

/* EXPLOSION ENGINE */

let explosion=1;
let spinning=false;
let selected=0;

function setExplosion(value){
 explosion=value/100;

 parts.forEach(mesh=>{
  if(!mesh)return;

  const base=mesh.userData.base;
  const distance=mesh.userData.explodeY;

  mesh.position.set(
   base.x,
   base.y+distance*explosion,
   base.z
  );
 });

 document.getElementById('expText').textContent=value+'%';
 document.getElementById('explosion').value=value;
 document.getElementById('explode').classList.toggle('active',value>0);
 document.getElementById('assemble').classList.toggle('active',value===0);
}

document.getElementById('explode').onclick=()=>setExplosion(100);
document.getElementById('assemble').onclick=()=>setExplosion(0);

document.getElementById('explosion').oninput=e=>{
 setExplosion(+e.target.value);
};

/* SELECT COMPONENT */

function selectPart(index){
 selected=index;

 document.getElementById('title').textContent=
 'PART #'+(index+1)+' : '+data[index][0];

 document.getElementById('description').textContent=
 data[index][1];

 document.querySelectorAll('.part').forEach((el,i)=>{
  el.classList.toggle('selected',i===index);
 });

 parts.forEach((m,i)=>{
  if(m)m.material.emissiveIntensity=i===index?0.65:0;
 });

 if(explosion===0)setExplosion(100);
}

/* PART LIST */

const list=document.getElementById('parts');

data.forEach((item,i)=>{
 const btn=document.createElement('button');
 btn.className='part';
 btn.innerHTML=`<b>${i+1}</b>${item[0]}<small>${item[1]}</small>`;
 btn.onclick=()=>selectPart(i);
 list.appendChild(btn);
});

/* MOUSE SELECTION */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('click',e=>{
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(parts.filter(Boolean));

 if(hits.length){
  selectPart(hits[0].object.userData.index);
 }
});

/* SPIN */

document.getElementById('spin').onclick=()=>{
 spinning=!spinning;
 document.getElementById('spin').classList.toggle('active',spinning);
 document.getElementById('spin').textContent=
 spinning?'⏸ STOP SPIN':'🔄 360° AUTO SPIN';
};

/* MANUAL ROTATION */

document.getElementById('rotation').oninput=e=>{
 watch.rotation.y=Number(e.target.value)*Math.PI/180;
 document.getElementById('rotText').textContent=e.target.value+'°';
};

/* RESET */

document.getElementById('reset').onclick=()=>{
 spinning=false;
 watch.rotation.set(0,0,0);
 camera.position.set(9,10,13);
 orbit.target.set(0,0,0);
 orbit.update();

 document.getElementById('rotation').value=0;
 document.getElementById('rotText').textContent='0°';
 document.getElementById('spin').textContent='🔄 360° AUTO SPIN';
 document.getElementById('spin').classList.remove('active');

 setExplosion(100);
 selectPart(0);
};

/* LOOP */

function animate(){
 requestAnimationFrame(animate);

 if(spinning)watch.rotation.y+=0.006;

 orbit.update();
 renderer.render(scene,camera);
}
animate();

/* RESIZE */

window.addEventListener('resize',()=>{
 camera.aspect=stage.clientWidth/stage.clientHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(stage.clientWidth,stage.clientHeight);
});

setExplosion(100);
selectPart(0);

</script>
</body>
</html>
